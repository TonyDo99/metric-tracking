services:
  postgres_db:
    container_name: metric-tracking-postgres
    image: postgres:18.7-alpine
    restart: always
    env_file: .env
    environment:
      POSTGRES_USER: '${DB_USER}'
      POSTGRES_PASSWORD: '${DB_PASSWORD}'
      POSTGRES_DB: '${DB_NAME}'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./seeding/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - '${DB_PORT}:5432'

volumes:
  postgres_data:
    driver: local
